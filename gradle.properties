kotlin.code.style=official

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Gradle shares one plugin classloader between builds whose plugin classpaths are identical, so the cores' shared
# convention plugins are loaded once. A build that also applies a repository-local convention plugin gets a classpath
# of its own, and with it its own copies of the Kotlin, KSP, Dokka and Kotest plugins. The limit is headroom, not a
# need; 512 MiB ran out while linking kotlin-core's native tests.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
