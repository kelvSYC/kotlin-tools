kotlin.code.style=official

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Every included build (one per core) loads its own copy of the shared convention plugins' classpath, so the daemon's
# metaspace use grows with the number of cores; 512 MiB ran out while linking kotlin-core's native tests.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
